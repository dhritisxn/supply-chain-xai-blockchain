# threshold_config.yaml
#
# Single source of truth for the Decision Gate's autonomous-execution
# threshold and each model's confidence-scoring calibration constant.
# Nothing else in the codebase should hard-code 0.85 -- always import
# `get_threshold()` from confidence_estimator.py instead.

CONFIDENCE_THRESHOLD: 0.85

# alpha controls how sharply confidence decays as the (relative-to-forecast)
# uncertainty interval widens: confidence = exp(-alpha * relative_width).
# Higher alpha = stricter (a given interval width yields a lower score).
#
# These values come from confidence/calibrate.py run on the synthetic
# dataset (heteroscedastic noise: promo/holiday days have ~2-3x the base
# noise variance, matching real retail behavior). Re-run calibrate.py after
# swapping in a real dataset and update these accordingly.
xgboost:
  alpha: 1.0   # calibrated: confidence-vs-error correlation = -0.346 (strong, correct direction)

prophet:
  alpha: 1.0   # calibrated, but see CAVEAT below -- correlation = +0.250 (wrong direction)

lstm:
  alpha: 0.5   # calibrated: correlation = -0.081 (correct direction, weak)
  mc_dropout_passes: 30
  z_multiplier: 1.28   # ~80% CI half-width, matching XGBoost/Prophet's 80% interval convention

# CAVEAT (documented honestly rather than silently accepted):
# Prophet's yhat_lower/yhat_upper interval is driven by ONE global fitted
# observation-noise parameter (sigma_obs) plus trend/changepoint MCMC
# uncertainty -- it is homoscedastic by construction. Even with is_promo
# passed in as an extra regressor, the interval width barely differs
# between promo and non-promo days (verified empirically: 27.09 vs 27.13
# mean width on the SKU_A/North series) because a regressor shifts the
# *mean*, not Prophet's per-observation uncertainty. XGBoost's quantile
# regression and the LSTM's MC-Dropout don't have this limitation -- they
# both scored in the correct direction. This is worth stating explicitly
# in the Review-2 report as a documented tradeoff of Prophet's XAI
# strategy, not glossed over.
