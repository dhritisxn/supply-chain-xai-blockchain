<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="confGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Blockchain-Verified, Confidence-Gated XAI Supply Chain</text>
  <text x="450" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">Architecture Overview  |  Review-2</text>

  <!-- ==================== STAGE 1: DATA ==================== -->
  <rect x="280" y="95" width="340" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="118" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">DATA LAYER</text>
  <text x="450" y="138" text-anchor="middle" fill="#94a3b8" font-size="11">Sales | Promotions | Holidays | Price</text>

  <!-- Arrow down -->
  <line x1="450" y1="150" x2="450" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <defs><marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker></defs>

  <!-- ==================== STAGE 2: TRI-MODEL FORECAST ==================== -->
  <rect x="120" y="175" width="660" height="100" rx="12" fill="url(#mlGrad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="200" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">TRI-MODEL FORECAST ENGINE</text>

  <!-- Three model boxes -->
  <rect x="150" y="215" width="180" height="48" rx="8" fill="#1e40af" opacity="0.8"/>
  <text x="240" y="235" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">XGBoost</text>
  <text x="240" y="252" text-anchor="middle" fill="#93c5fd" font-size="10">Quantile Regression</text>

  <rect x="360" y="215" width="180" height="48" rx="8" fill="#1e40af" opacity="0.8"/>
  <text x="450" y="235" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">Prophet</text>
  <text x="450" y="252" text-anchor="middle" fill="#93c5fd" font-size="10">Native Uncertainty</text>

  <rect x="570" y="215" width="180" height="48" rx="8" fill="#1e40af" opacity="0.8"/>
  <text x="660" y="235" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">LSTM</text>
  <text x="660" y="252" text-anchor="middle" fill="#93c5fd" font-size="10">MC-Dropout Variance</text>

  <!-- Arrow down -->
  <line x1="450" y1="275" x2="450" y2="300" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#60a5fa"/></marker></defs>

  <!-- ==================== STAGE 3: EXPLAINABILITY ==================== -->
  <rect x="120" y="300" width="660" height="55" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4"/>
  <text x="450" y="322" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">EXPLAINABILITY LAYER</text>
  <text x="450" y="342" text-anchor="middle" fill="#64748b" font-size="10">SHAP Values  |  Prophet Decomposition  |  Attention Weights</text>

  <!-- Arrow down -->
  <line x1="450" y1="355" x2="450" y2="380" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ==================== STAGE 4: CONFIDENCE ==================== -->
  <rect x="200" y="380" width="500" height="75" rx="12" fill="url(#confGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="405" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">CONFIDENCE ESTIMATION MODULE</text>
  <text x="450" y="425" text-anchor="middle" fill="#e0d4fc" font-size="11">confidence = exp(-alpha * interval_width / |forecast|)</text>
  <text x="450" y="445" text-anchor="middle" fill="#c4b5fd" font-size="10">Normalizes all models to 0-1 score  |  Threshold: 0.85</text>

  <!-- Arrow down -->
  <line x1="450" y1="455" x2="450" y2="480" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#a78bfa"/></marker></defs>

  <!-- ==================== STAGE 5: SS/ROP ==================== -->
  <rect x="250" y="480" width="400" height="55" rx="10" fill="url(#invGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="503" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">SS / ROP INVENTORY CALCULATOR</text>
  <text x="450" y="522" text-anchor="middle" fill="#fef3c7" font-size="10">Safety Stock = Z * sigma_d * sqrt(L)  |  ROP = D_daily * L + SS</text>

  <!-- Arrow down -->
  <line x1="450" y1="535" x2="450" y2="560" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <defs><marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#fbbf24"/></marker></defs>

  <!-- ==================== STAGE 6: DECISION GATE ==================== -->
  <rect x="280" y="560" width="340" height="65" rx="12" fill="url(#gateGrad)" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="585" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">DECISION GATE</text>
  <text x="450" y="605" text-anchor="middle" fill="#fecaca" font-size="11">confidence >= 0.85 ?</text>

  <!-- Three output arrows from gate -->
  <!-- Left: NO_ACTION -->
  <line x1="330" y1="625" x2="180" y2="680" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="80" y="680" width="200" height="55" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="180" y="700" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">NO_ACTION</text>
  <text x="180" y="718" text-anchor="middle" fill="#64748b" font-size="9">Stock sufficient</text>

  <!-- Center: AUTONOMOUS -->
  <line x1="450" y1="625" x2="450" y2="680" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#10b981"/></marker></defs>
  <rect x="350" y="680" width="200" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="700" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">AUTONOMOUS_EXECUTION</text>
  <text x="450" y="718" text-anchor="middle" fill="#34d399" font-size="9">Confidence meets threshold</text>

  <!-- Right: HUMAN_APPROVAL -->
  <line x1="570" y1="625" x2="720" y2="680" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber2)"/>
  <defs><marker id="arrowAmber2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker></defs>
  <rect x="620" y="680" width="200" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="720" y="700" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">HUMAN_APPROVAL</text>
  <text x="720" y="718" text-anchor="middle" fill="#d97706" font-size="9">Low confidence, flagged</text>

  <!-- ==================== STAGE 7: BLOCKCHAIN ==================== -->
  <!-- Arrow from AUTONOMOUS to blockchain -->
  <line x1="450" y1="735" x2="450" y2="770" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Arrow from HUMAN_APPROVAL to blockchain -->
  <line x1="720" y1="735" x2="600" y2="770" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber2)"/>

  <rect x="150" y="770" width="600" height="90" rx="12" fill="url(#chainGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="795" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">BLOCKCHAIN AUDIT LEDGER</text>

  <!-- Two functions inside blockchain -->
  <rect x="180" y="810" width="260" height="38" rx="6" fill="#065f46" opacity="0.8"/>
  <text x="310" y="833" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="bold">logDecision()  [always]</text>

  <rect x="460" y="810" width="260" height="38" rx="6" fill="#065f46" opacity="0.8"/>
  <text x="590" y="833" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="bold">autoExecutePO()  [gated]</text>

  <!-- Blockchain subtext -->
  <text x="450" y="855" text-anchor="middle" fill="#d1fae5" font-size="9">ReplenishmentLedger.sol  |  Ganache  |  web3.py  |  Immutable Records</text>

  <!-- Arrow down -->
  <line x1="450" y1="860" x2="450" y2="890" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen2)"/>
  <defs><marker id="arrowGreen2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#34d399"/></marker></defs>

  <!-- ==================== STAGE 8: BACKEND + DASHBOARD ==================== -->
  <rect x="150" y="890" width="600" height="70" rx="12" fill="url(#uiGrad)" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="915" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">FASTAPI BACKEND + STREAMLIT DASHBOARD</text>
  <text x="450" y="935" text-anchor="middle" fill="#cffafe" font-size="10">Forecast View  |  Explainability Panel  |  Confidence Gate  |  Audit Ledger  |  Approval Queue</text>
  <text x="450" y="952" text-anchor="middle" fill="#a5f3fc" font-size="9">GET /forecast  |  GET /ledger  |  GET /approvals  |  POST /forecast/run  |  POST /ledger/verify</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="50" y="990" width="800" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="1015" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">Pipeline Flow Legend</text>

  <rect x="80" y="1030" width="16" height="16" rx="3" fill="url(#mlGrad)"/>
  <text x="105" y="1043" fill="#cbd5e1" font-size="10">ML / Forecasting</text>

  <rect x="220" y="1030" width="16" height="16" rx="3" fill="url(#confGrad)"/>
  <text x="245" y="1043" fill="#cbd5e1" font-size="10">Confidence Scoring</text>

  <rect x="380" y="1030" width="16" height="16" rx="3" fill="url(#gateGrad)"/>
  <text x="405" y="1043" fill="#cbd5e1" font-size="10">Decision Routing</text>

  <rect x="530" y="1030" width="16" height="16" rx="3" fill="url(#chainGrad)"/>
  <text x="555" y="1043" fill="#cbd5e1" font-size="10">Blockchain / Ledger</text>

  <rect x="700" y="1030" width="16" height="16" rx="3" fill="url(#uiGrad)"/>
  <text x="725" y="1043" fill="#cbd5e1" font-size="10">Backend / UI</text>

  <text x="450" y="1070" text-anchor="middle" fill="#475569" font-size="9">ML governs blockchain via confidence gating | SHAP explanations hashed on-chain | Immutable audit trail</text>
</svg>
